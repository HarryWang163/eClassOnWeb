<!-- 修改密码模态框 -->
<div class="modal fade" id="changePasswordModal" tabindex="-1" aria-labelledby="changePasswordModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="changePasswordModalLabel">
                    <i class="bi bi-shield-lock me-2"></i>修改密码
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="关闭"></button>
            </div>
            <div class="modal-body">
                <div id="passwordChangeAlert"></div>
                
                <form id="passwordChangeForm">
                    <!-- 旧密码 -->
                    <div class="mb-3">
                        <label for="old_password" class="form-label">
                            <i class="bi bi-key me-1"></i>当前密码
                        </label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="old_password" 
                                   placeholder="请输入当前密码" required>
                            <button class="btn btn-outline-secondary" type="button" id="toggleOldPassword">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <div class="form-text">请输入您当前的登录密码</div>
                    </div>
                    
                    <!-- 新密码 -->
                    <div class="mb-3">
                        <label for="new_password" class="form-label">
                            <i class="bi bi-key-fill me-1"></i>新密码
                        </label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="new_password" 
                                   placeholder="请输入新密码" required minlength="6">
                            <button class="btn btn-outline-secondary" type="button" id="toggleNewPassword">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        
                        <!-- 密码强度指示器 -->
                        <div class="mt-2">
                            <div class="progress" style="height: 5px;">
                                <div id="passwordStrengthBar" class="progress-bar" role="progressbar" 
                                     style="width: 0%; transition: width 0.3s ease;"></div>
                            </div>
                            <div id="passwordStrengthText" class="small mt-1"></div>
                        </div>
                        
                        <div class="form-text">密码长度至少6位，建议包含字母、数字和特殊字符</div>
                    </div>
                    
                    <!-- 确认新密码 -->
                    <div class="mb-4">
                        <label for="confirm_password" class="form-label">
                            <i class="bi bi-key-fill me-1"></i>确认新密码
                        </label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="confirm_password" 
                                   placeholder="请再次输入新密码" required minlength="6">
                            <button class="btn btn-outline-secondary" type="button" id="toggleConfirmPassword">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <div id="passwordMatchFeedback" class="password-feedback small mt-1" style="display: none;"></div>
                    </div>
                    
                    <!-- 密码要求提示 -->
                    <div class="alert alert-info small">
                        <h6 class="alert-heading"><i class="bi bi-info-circle me-1"></i>密码安全要求：</h6>
                        <ul class="mb-0">
                            <li>长度至少6个字符</li>
                            <li>不能与旧密码相同</li>
                            <li>建议使用字母、数字和符号的组合</li>
                            <li>不要使用常见的密码（如123456、password等）</li>
                        </ul>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="cancelPasswordBtn" data-bs-dismiss="modal">
                    <i class="bi bi-x-circle me-1"></i>取消
                </button>
                <button type="button" class="btn btn-primary" id="savePasswordBtn">
                    <i class="bi bi-check-circle me-1"></i>保存修改
                </button>
            </div>
        </div>
    </div>
</div>
