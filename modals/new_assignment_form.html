<div class="card">
    <div class="card-header bg-primary text-white">
        <h6 class="mb-0"><i class="bi bi-plus-circle me-2"></i>新建作业</h6>
    </div>
    <div class="card-body">
        <form id="assignmentForm" onsubmit="saveAssignment(event)">
            <input type="hidden" name="assignment_id" value="0">
            
            <div class="mb-3">
                <label for="assignmentContent" class="form-label">作业内容 <span class="text-danger">*</span></label>
                <textarea class="form-control" id="assignmentContent" name="assignment_content" 
                          rows="3" required placeholder="请输入作业内容..."></textarea>
            </div>
            
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="assignmentDeadline" class="form-label">截止日期</label>
                    <input type="date" class="form-control" id="assignmentDeadline" name="assignment_deadline">
                    <div class="form-text">留空表示无截止日期</div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">提交要求</label>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" id="needSubmit" name="need_submit">
                        <label class="form-check-label" for="needSubmit">需要提交</label>
                    </div>
                    <input type="text" class="form-control" id="submitItems" name="submit_items" 
                           placeholder="提交物品（如：练习册、试卷等）" disabled>
                </div>
            </div>
            
            <div class="mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="hasDetails" name="has_details">
                    <label class="form-check-label" for="hasDetails">添加详细说明</label>
                </div>
            </div>
            
            <div id="detailsField" class="mb-3" style="display: none;">
                <label for="assignmentDetails" class="form-label">详细说明</label>
                <textarea class="form-control" id="assignmentDetails" name="assignment_details" 
                          rows="4" placeholder="请输入作业的详细要求、注意事项等..."></textarea>
            </div>
            
            <div class="mb-3">
                <label class="form-label">附件（暂不支持）</label>
                <input type="file" class="form-control" disabled>
                <div class="form-text">附件上传功能将在后续版本中提供</div>
            </div>
            
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary">保存作业</button>
                <button type="button" class="btn btn-outline-secondary" onclick="cancelForm()">取消</button>
            </div>
        </form>
    </div>
</div>

<script>
// 表单交互逻辑
document.addEventListener('DOMContentLoaded', function() {
    // 需要提交复选框事件
    const needSubmitCheckbox = document.getElementById('needSubmit');
    const submitItemsInput = document.getElementById('submitItems');
    
    if (needSubmitCheckbox && submitItemsInput) {
        needSubmitCheckbox.addEventListener('change', function() {
            submitItemsInput.disabled = !this.checked;
            if (!this.checked) {
                submitItemsInput.value = '';
            }
        });
    }
    
    // 详细说明复选框事件
    const hasDetailsCheckbox = document.getElementById('hasDetails');
    const detailsField = document.getElementById('detailsField');
    
    if (hasDetailsCheckbox && detailsField) {
        hasDetailsCheckbox.addEventListener('change', function() {
            detailsField.style.display = this.checked ? 'block' : 'none';
            if (!this.checked) {
                document.getElementById('assignmentDetails').value = '';
            }
        });
    }
});

// 保存作业
function saveAssignment(event) {
    event.preventDefault();
    
    const form = event.target;
    const formData = new FormData(form);
    const data = Object.fromEntries(formData.entries());
    
    // 处理复选框值
    data.need_submit = form.elements['need_submit'].checked ? 1 : 0;
    data.has_details = form.elements['has_details'].checked ? 1 : 0;
    
    // 添加学科ID（需要从上下文获取）
    const subjectId = getCurrentSubjectId(); // 需要实现此函数
    
    fetch('api/save_assignment.php', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify(data)
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            showSuccess('作业保存成功');
            // 重新加载列表
            loadSubjectAssignments(subjectId);
            // 重置表单（如果是新建）
            if (form.elements['assignment_id'].value === '0') {
                form.reset();
            }
        } else {
            showError('保存失败: ' + data.message);
        }
    })
    .catch(error => {
        console.error('保存作业失败:', error);
        showError('保存失败，请检查网络连接');
    });
}

// 取消表单
function cancelForm() {
    // 返回作业列表视图
    loadSubjectAssignments(getCurrentSubjectId());
}
</script>
